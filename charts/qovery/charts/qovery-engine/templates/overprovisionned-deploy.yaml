      {{- with .Values.overprovisionning.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 1
      containers:
      - name: buildkit
        image: {{ $buildkitImage }}
        # Only warms the image: rootless buildkitd crash-loops without the builder pod's unconfined profiles
