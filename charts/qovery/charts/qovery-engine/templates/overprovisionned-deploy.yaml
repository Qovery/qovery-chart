{{- if .Values.overprovisionning.enabled }}
{{- /* Warms the image builder pods run. Must equal BUILDKIT_VERSION in lib-engine/src/cmd/docker.rs: a test there fails otherwise */}}
{{- $buildkitImage := "moby/buildkit:v0.34.1" }}
{{- /* Engine gets BUILDER_* env only when buildContainer is enabled, else defaults to rootful */}}
{{- if and .Values.buildContainer.enabled (eq (toString .Values.buildContainer.environmentVariables.BUILDER_ROOTLESS_ENABLED) "true") }}
{{- $buildkitImage = printf "%s-rootless" $buildkitImage }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qovery-engine-overprovisionning-amd64
  labels:
    app: qovery-engine-overprovisioning-amd64
spec:
  replicas: {{ .Values.overprovisionning.replicas.amd64 }}
  selector:
    matchLabels:
      app: qovery-engine-overprovisioning-amd64
  template:
    metadata:
      labels:
        app: qovery-engine-overprovisioning-amd64
    spec:
      priorityClassName: {{ .Values.overprovisionning.priorityClass.name }}
      nodeSelector:
        kubernetes.io/arch: amd64
        {{- with omit .Values.overprovisionning.nodeSelector "kubernetes.io/arch" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.overprovisionning.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 1
      containers:
      - name: buildkit
        image: {{ $buildkitImage }}
        # Only warms the image: rootless buildkitd crash-loops without the builder pod's unconfined profiles
        command: ["/bin/sh", "-c", "tail -f /dev/null"]
      - name: qovery-engine-overprovisionning
        # use engine image to warm up the cache
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        command: ["/bin/sh", "-c", "tail -f /dev/null"]
        resources:
        {{- toYaml .Values.overprovisionning.resources | nindent 10 }}
---
